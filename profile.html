<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tongue Twisted | Profile</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="profile.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <h1>Tongue Twisted</h1>
    </header>

    <main class="main-content profile-content">
      <section class="profile-card" aria-label="User profile">
        <div class="profile-heading">
          <img
            class="profile-avatar"
            src="assets/foto-spicy.jpg"
            alt="Marco Oliveira"
          />
          <h2>MMART</h2>
        </div>

        <section class="profile-about">
          <h3>About me</h3>
          <p>
            I love languages, words and discovering interesting expressions from
            around the world.
          </p>
        </section>

        <div class="profile-statistics">
          <div class="profile-stat">
            <span aria-hidden="true">❔</span>
            <span>12</span>
            <span class="visually-hidden">Questions created</span>
          </div>

          <div class="profile-stat">
            <span aria-hidden="true">🔖</span>
            <span>4</span>
            <span class="visually-hidden">Bookmarks</span>
          </div>
        </div>

        <section class="profile-settings">
          <h3>Settings</h3>

          <div class="profile-setting">
            <span class="mode-label">Bright Mode</span>
            <button
              class="dark-mode-switch"
              type="button"
              aria-label="Toggle dark mode"
              aria-pressed="false"
            >
              <span aria-hidden="true"></span>
            </button>
          </div>
        </section>
      </section>
    </main>

    <!-- Copy the footer navigation from bookmarks.html here.
       Set aria-current="page" on the Profile link. -->

    <footer class="site-footer">
      <nav class="language-tabs" aria-label="Filter by language">
        <button class="language-tab language-pt" type="button">PT</button>
        <button class="language-tab language-es" type="button">ES</button>
        <button class="language-tab language-fr" type="button">FR</button>
        <button class="language-tab language-en" type="button">EN</button>
        <button class="language-tab language-de" type="button">DE</button>
        <button class="language-tab language-cross" type="button">?</button>
      </nav>

      <nav class="main-navigation" aria-label="Main navigation">
        <a href="index.html" aria-label="Home">
          <img src="assets/home.png" alt="" />
        </a>

        <a href="bookmarks.html" aria-label="Bookmarks">
          <img src="assets/ribbon.png" alt="" />
        </a>

        <a href="profile.html" aria-label="Profile" aria-current="page">
          <img src="assets/user-black.png" alt="" />
        </a>
      </nav>
    </footer>
  </body>
</html>
